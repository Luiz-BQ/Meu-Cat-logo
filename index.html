<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Catálogo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Meu Catálogo</h1>
    </header>

    <main>
        <section class="form-container">
            <h2>Cadastrar Novo Item</h2>
            <form id="form-item">
                <input type="text" id="nome" placeholder="Nome do Livro ou filme" required>
                <input type="text" id="categoria" placeholder="Categoria (Ex: Filme, Livro)" required>
                <textarea id="descricao" placeholder="Descrição do Livro ou Filme" rows="3"></textarea>
                <input type="number" id="nota" step="0.01" placeholder="Nota" required>
                <button type="submit">Cadastrar</button>
            </form>
        </section>

        <section>
            <h2>Itens Cadastrados</h2>
            <div id="catalogo-grid" class="grid-container"></div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
